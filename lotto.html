<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>로또 번호 만들기</title>
<style>
:root{color-scheme:light;--ink:#1E2A30;--teal:#134B5F;--line:#D5DDE0;--muted:#6B7A80}*{box-sizing:border-box}body{margin:0;background:#F5F7F8;color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;word-break:keep-all}main{max-width:760px;margin:auto;padding:32px 18px}header{margin-bottom:30px}.kicker{color:#D9741F;font-size:12px;font-weight:700;letter-spacing:2px}h1{font-size:28px;line-height:1.4;margin:10px 0}p{color:var(--muted);font-size:14px;line-height:1.7}section{background:white;padding:22px 18px;margin-bottom:20px;border:1px solid var(--line)}h2{font-size:18px;color:var(--teal);margin:0 0 16px}button,input{font:inherit}button{cursor:pointer;min-height:44px;border:1px solid var(--line);background:white;color:var(--teal);padding:10px 16px;border-radius:4px;font-weight:700}button:hover{background:#EEF3F5}button:disabled{cursor:wait;opacity:.55}button:focus-visible,input:focus-visible{outline:3px solid #134B5F;outline-offset:3px}.primary{background:var(--teal);color:white;border-color:var(--teal);flex:1}.primary:hover{background:#206078}.actions{display:flex;gap:8px;flex-wrap:wrap}.fields{display:grid;gap:18px;margin-bottom:20px}label{display:block;font-size:14px;font-weight:700;margin-bottom:8px}input{width:100%;min-height:46px;border:1px solid var(--line);padding:10px;background:#F5F7F8;border-radius:3px}.hint{font-size:12px;margin:7px 0 0}.status{font-size:14px;min-height:24px;margin:14px 0 0;color:var(--teal)}.games{min-height:78px}.game{padding:16px 0;border-bottom:1px solid var(--line)}.game:last-child{border-bottom:0}.game-label{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:12px}.game-label button{font-size:12px;min-height:32px;padding:5px 10px}.balls{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;overflow:hidden;padding:3px 0}.ball{width:100%;max-width:54px;aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-size:18px;font-weight:700;box-shadow:inset -3px -4px 0 #00000015;text-shadow:0 1px 1px #0005}.yellow{background:#e5ac16}.blue{background:#368cca}.red{background:#df5955}.gray{background:#858b90}.green{background:#5b9f58}.rolling{animation:roll .55s ease-out both}@keyframes roll{from{transform:translateX(-180px) rotate(-300deg);opacity:0}to{transform:translateX(0) rotate(0);opacity:1}}.legend{display:flex;gap:8px 14px;flex-wrap:wrap;margin-top:16px;color:var(--muted);font-size:11px}.legend span{display:flex;align-items:center;gap:5px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.history-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.history-head h2{margin:0}.history-head button{font-size:12px}.history-entry{padding:18px 0;border-bottom:1px solid var(--line)}.history-entry:last-child{border:0}.history-meta{font-size:12px;color:var(--muted);line-height:1.8}.history-entry .game{padding:9px 0}.empty{padding:20px 0;margin:0}footer{font-size:12px;color:var(--muted);line-height:1.8}.copybox{width:100%;height:80px;margin-top:10px} @media(min-width:600px){main{padding:48px 24px}h1{font-size:36px}section{padding:26px}.fields{grid-template-columns:1fr 1fr}.ball{font-size:21px}.balls{max-width:400px}}@media(prefers-reduced-motion:reduce){.rolling{animation:none}}
</style>
</head>
<body>
<main>
<header><div class="kicker">LOTTO 6 / 45</div><h1>원하는 조건으로<br>6개 번호를 만듭니다</h1><p>1부터 45까지, 중복 없이 작은 번호부터 정렬합니다.</p></header>
<section aria-labelledby="settings"><h2 id="settings">번호 조건</h2><div class="fields"><div><label for="include">꼭 넣을 번호</label><input id="include" placeholder="예: 3, 12, 25" inputmode="text" autocomplete="off"><p class="hint">최대 6개. 쉼표 또는 공백으로 구분합니다.</p></div><div><label for="exclude">뺄 번호</label><input id="exclude" placeholder="예: 7, 14, 30" inputmode="text" autocomplete="off"><p class="hint">선택한 번호는 모든 게임에서 제외합니다.</p></div></div><div class="actions"><button class="primary" id="one">1게임 만들기</button><button class="primary" id="five">5게임 만들기</button></div><p class="status" id="status" role="status" aria-live="polite"></p></section>
<section aria-labelledby="result-title"><h2 id="result-title">이번 번호</h2><div id="results" class="games"><p class="empty">게임을 만들면 공이 하나씩 굴러 나옵니다.</p></div><div class="actions"><button id="copy-all" disabled>전체 번호 복사</button></div><div class="legend"><span><i class="dot yellow"></i>1–10</span><span><i class="dot blue"></i>11–20</span><span><i class="dot red"></i>21–30</span><span><i class="dot gray"></i>31–40</span><span><i class="dot green"></i>41–45</span></div></section>
<section><div class="history-head"><h2>기록 목록</h2><button id="clear">기록 비우기</button></div><p class="hint">최근 30회 기록을 이 브라우저에 보관합니다.</p><div id="history"></div></section>
<footer>번호 생성은 당첨 확률을 높이지 않습니다.<br>모든 처리는 브라우저 안에서 이루어집니다. 인터넷 연결 없이도 사용할 수 있습니다.</footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),key='lotto-single-history-v1';
let current=[],history=[],busy=false;
try{const saved=JSON.parse(localStorage.getItem(key)||'[]');if(Array.isArray(saved))history=saved.filter(x=>x&&typeof x.time==='string'&&Array.isArray(x.games)&&x.games.length<=5&&x.games.every(g=>Array.isArray(g)&&g.length===6&&new Set(g).size===6&&g.every(n=>Number.isInteger(n)&&n>=1&&n<=45))).slice(0,30);}catch(e){}
function parse(value,label){if(!value.trim())return [];const parts=value.trim().split(/[\s,，]+/);if(parts.some(p=>!/^\d+$/.test(p)||Number(p)<1||Number(p)>45))throw Error(label+'에는 1부터 45까지의 정수만 입력해 주세요.');return [...new Set(parts.map(Number))];}
function randomIndex(max){const a=new Uint32Array(1),limit=Math.floor(4294967296/max)*max;do{crypto.getRandomValues(a);}while(a[0]>=limit);return a[0]%max;}
function draw(inc,exc){const pool=Array.from({length:45},(_,i)=>i+1).filter(n=>!inc.includes(n)&&!exc.includes(n)),out=[...inc];while(out.length<6)out.push(pool.splice(randomIndex(pool.length),1)[0]);return out.sort((a,b)=>a-b);}
function color(n){return n<=10?'yellow':n<=20?'blue':n<=30?'red':n<=40?'gray':'green';}
function ball(n,animate){const el=document.createElement('span');el.className='ball '+color(n)+(animate?' rolling':'');el.textContent=n;return el;}
function gameRow(nums,index,withBalls=true){const row=document.createElement('div');row.className='game';const label=document.createElement('div');label.className='game-label';const name=document.createElement('span');name.textContent='게임 '+(index+1);label.append(name);const btn=document.createElement('button');btn.textContent='복사';btn.addEventListener('click',()=>copy(nums.join(', ')));label.append(btn);row.append(label);const balls=document.createElement('div');balls.className='balls';balls.setAttribute('aria-label',nums.join(', '));if(withBalls)nums.forEach(n=>balls.append(ball(n,false)));row.append(balls);return {row,balls,btn};}
async function copy(text){try{if(!navigator.clipboard)throw Error();await navigator.clipboard.writeText(text);$('status').textContent='번호를 복사했습니다.';}catch(e){const area=document.createElement('textarea');area.value=text;area.className='copybox';area.setAttribute('aria-label','복사할 번호');$('results').append(area);area.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}if(ok){area.remove();$('status').textContent='번호를 복사했습니다.';}else $('status').textContent='아래 선택된 번호를 길게 누르거나 Ctrl+C로 복사해 주세요.';}}
function save(){try{localStorage.setItem(key,JSON.stringify(history));return true;}catch(e){return false;}}
function renderHistory(){$('history').replaceChildren();if(!history.length){const p=document.createElement('p');p.className='empty';p.textContent='아직 저장된 기록이 없습니다.';$('history').append(p);return;}history.forEach(entry=>{const block=document.createElement('div');block.className='history-entry';const meta=document.createElement('div');meta.className='history-meta';meta.textContent=entry.time+' · '+entry.games.length+'게임';block.append(meta);entry.games.forEach((g,i)=>block.append(gameRow(g,i).row));$('history').append(block);});}
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function generate(count){if(busy)return;try{const inc=parse($('include').value,'꼭 넣을 번호'),exc=parse($('exclude').value,'뺄 번호');if(inc.length>6)throw Error('꼭 넣을 번호는 최대 6개까지 가능합니다.');if(inc.some(n=>exc.includes(n)))throw Error('같은 번호를 넣을 번호와 뺄 번호에 동시에 지정할 수 없습니다.');if(45-exc.length<6)throw Error('제외한 뒤 최소 6개 번호가 남아야 합니다.');current=Array.from({length:count},()=>draw(inc,exc));}catch(e){$('status').textContent=e.message;return;}busy=true;$('one').disabled=$('five').disabled=$('copy-all').disabled=true;$('results').replaceChildren();$('status').textContent=count+'게임 번호를 만들고 있습니다.';const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;for(let i=0;i<current.length;i++){const {row,balls,btn}=gameRow(current[i],i,false);btn.disabled=true;$('results').append(row);for(const n of current[i]){balls.append(ball(n,!reduced));if(!reduced)await pause(180);}btn.disabled=false;}history.unshift({time:new Date().toLocaleString('ko-KR'),games:current.map(g=>[...g])});history=history.slice(0,30);const stored=save();renderHistory();busy=false;$('one').disabled=$('five').disabled=$('copy-all').disabled=false;$('status').textContent=count+'게임을 만들었습니다.'+(stored?'':' 브라우저 저장을 사용할 수 없어 기록은 현재 화면에만 남습니다.');}
$('one').addEventListener('click',()=>generate(1));$('five').addEventListener('click',()=>generate(5));$('copy-all').addEventListener('click',()=>copy(current.map((g,i)=>'게임 '+(i+1)+': '+g.join(', ')).join('\n')));$('clear').addEventListener('click',()=>{if(!history.length)return;if(confirm('저장된 번호 기록을 모두 비울까요?')){history=[];save();renderHistory();$('status').textContent='기록을 비웠습니다.';}});renderHistory();
</script>
</body>
</html>
